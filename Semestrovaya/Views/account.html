<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{Heading}} — Респонс</title>
    <link rel="stylesheet" href="/css/gallery.css">
</head>
<body>
<header class="header">
    <div class="header-top"><a class="logo" href="/">Респонс</a></div>
</header>
<main class="main narrow">
    <a class="back-link" href="/">← К галерее</a>
    <h1>{{Heading}}</h1>
    <form class="panel account-form" action="{{Action}}" method="post">
        {{#if Error}}<p class="message error-text" role="alert">{{Error}}</p>{{/if}}
        <label>Имя пользователя
            <input name="username" value="{{Username}}" autocomplete="username" minlength="3" maxlength="50" pattern="[A-Za-z0-9_\-]{3,50}" required>
        </label>
        {{#if Register}}
        <label>Электронная почта
            <input name="email" value="{{Email}}" type="email" autocomplete="email" maxlength="255" required>
        </label>
        {{/if}}
        <label>Пароль
            <input name="password" type="password" autocomplete="{{#if Register}}new-password{{else}}current-password{{/if}}"
                   {{#if Register}}minlength="10"{{/if}} maxlength="128" required>
        </label>
        <button class="primary" type="submit">{{Heading}}</button>
    </form>
    {{#if Register}}<p><a href="/login">У меня уже есть аккаунт</a></p>
    {{else}}<p><a href="/register">Создать аккаунт</a></p>{{/if}}
</main>
</body>
</html>
