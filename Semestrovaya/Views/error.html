
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Ошибка {{ErrorCode}}</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1c1c1c;
            color: white;
            font-family: Arial, sans-serif;
        }

        .error {
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 64px;
            margin: 0 0 15px;
        }

        p {
            font-size: 18px;
            color: #aaa;
            margin-bottom: 25px;
        }

        a,
        a:hover,
        a:visited,
        a:active {
            color: white;
            font-size: 16px;
            text-decoration: underline;
        }
    </style>
</head>

<body>
<div class="error">
    <h1>{{ErrorCode}}</h1>
    <p>{{ErrorMessage}}</p>
    <a href="/">Вернуться к галерее</a>
</div>
</body>
</html>
